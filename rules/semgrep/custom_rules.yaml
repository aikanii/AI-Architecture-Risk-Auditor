# Semgrep rules for AI Architecture Risk Auditor
# These are example custom rules in addition to built-in packs

rules:
  - id: hardcoded-secret
    pattern-either:
      - pattern: |
          $KEY = "sk-..."
      - pattern: |
          $KEY = "..._secret"
      - pattern: |
          JWT_SECRET = "..."
    message: "Hardcoded secret detected in source code"
    languages: [python]
    severity: CRITICAL
    metadata:
      cwe: CWE-798
      owasp: "A01:2021 - Broken Access Control"

  - id: unencrypted-http-call
    pattern-either:
      - pattern: |
          requests.get("http://...")
      - pattern: |
          httpx.get("http://...")
    message: "Unencrypted HTTP call (should use HTTPS)"
    languages: [python]
    severity: HIGH
    metadata:
      cwe: CWE-319
      owasp: "A02:2021 - Cryptographic Failures"

  - id: missing-input-validation
    pattern: |
      @app.get(...)
      def $FUNC($PARAM: int = Query(...)):
          ...
          return db.query(f"SELECT * FROM ... WHERE id = {$PARAM}")
    message: "Input validation missing or improper"
    languages: [python]
    severity: HIGH
    metadata:
      cwe: CWE-20
      owasp: "A03:2021 - Injection"

  - id: missing-auth-endpoint
    pattern-either:
      - pattern: |
          @app.get("/...")
          def $FUNC():
              ...
      - pattern: |
          @app.post("/...")
          def $FUNC():
              ...
    message: "Public endpoint without authentication check"
    languages: [python]
    severity: CRITICAL
    metadata:
      cwe: CWE-306
      owasp: "A01:2021 - Broken Access Control"

  - id: hardcoded-database-password
    pattern: |
      "...://...:$PASSWORD@..."
    message: "Hardcoded database password in connection string"
    languages: [python, javascript]
    severity: CRITICAL
    metadata:
      cwe: CWE-798
      owasp: "A02:2021 - Cryptographic Failures"

  - id: missing-rate-limiting
    pattern-either:
      - pattern: |
          @app.route("/...")
          def $FUNC():
              ...
      - pattern: |
          @app.get("/...")
          def $FUNC():
              ...
    message: "Public endpoint without rate limiting"
    languages: [python, javascript]
    severity: MEDIUM
    metadata:
      owasp: "A01:2021 - Broken Access Control"
