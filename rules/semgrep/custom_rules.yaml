# Semgrep rules for AI Architecture Risk Auditor
# Custom security and architectural rules

rules:
  - id: hardcoded-secret
    pattern-either:
      - pattern: |
          $KEY = "sk_..."
      - pattern: |
          $KEY = "sk-..."
      - pattern: |
          $KEY = "..._secret_..."
      - pattern: |
          JWT_SECRET = "..."
      - pattern: |
          STRIPE_API_KEY = "..."
    message: "Hardcoded secret detected in source code"
    languages: [python]
    severity: CRITICAL
    metadata:
      cwe: CWE-798
      owasp: "A01:2021 - Broken Access Control"

  - id: unencrypted-http-call
    pattern-either:
      - pattern: |
          requests.get("http://...", ...)
      - pattern: |
          httpx.get("http://...", ...)
      - pattern: |
          $URL = "http://..."
      - pattern: |
          $CLIENT.get(f"http://...", ...)
      - pattern: |
          $CLIENT.get("http://...", ...)
      - pattern: |
          $CLIENT.post("http://...", ...)
    message: "Unencrypted HTTP call (should use HTTPS)"
    languages: [python]
    severity: HIGH
    metadata:
      cwe: CWE-319
      owasp: "A02:2021 - Cryptographic Failures"

  - id: missing-input-validation
    pattern-either:
      - pattern: |
          @app.get("/users/{user_id}")
          async def $FUNC(user_id: int):
              ...
      - pattern: |
          @app.get(...)
          def $FUNC($PARAM: int = Query(...)):
              ...
    message: "Input validation missing or improper on endpoint parameter"
    languages: [python]
    severity: HIGH
    metadata:
      cwe: CWE-20
      owasp: "A03:2021 - Injection"

  - id: missing-auth-endpoint
    pattern-either:
      - pattern: |
          @app.get("/health")
          async def health():
              ...
    message: "Public endpoint without authentication check"
    languages: [python]
    severity: CRITICAL
    metadata:
      cwe: CWE-306
      owasp: "A01:2021 - Broken Access Control"

  - id: hardcoded-database-password
    pattern: |
      $URL = "postgresql://$USER:$PASS@$HOST:$PORT/$DB"
    message: "Hardcoded database password in connection string"
    languages: [python]
    severity: CRITICAL
    metadata:
      cwe: CWE-798
      owasp: "A02:2021 - Cryptographic Failures"

  - id: missing-rate-limiting
    pattern-either:
      - pattern: |
          @app.get("/api/orders")
          async def get_orders():
              ...
    message: "Public endpoint without rate limiting"
    languages: [python]
    severity: MEDIUM
    metadata:
      owasp: "A01:2021 - Broken Access Control"
